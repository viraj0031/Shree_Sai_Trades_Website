<svg width="900" height="1125" viewBox="0 0 900 1125" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgAbout" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#31353c"/>
      <stop offset="100%" stop-color="#0e1013"/>
    </linearGradient>
    <radialGradient id="sparkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd27a"/>
      <stop offset="60%" stop-color="#c1470f" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#c1470f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="900" height="1125" fill="url(#bgAbout)"/>

  <!-- structural beam grid backdrop -->
  <g stroke="#3d424a" stroke-width="4" opacity="0.6">
    <line x1="0" y1="200" x2="900" y2="200"/>
    <line x1="0" y1="500" x2="900" y2="500"/>
    <line x1="0" y1="800" x2="900" y2="800"/>
    <line x1="220" y1="0" x2="220" y2="1125"/>
    <line x1="620" y1="0" x2="620" y2="1125"/>
  </g>

  <!-- welding spark glow -->
  <circle cx="470" cy="470" r="220" fill="url(#sparkGlow)"/>

  <!-- welder silhouette -->
  <g fill="#171a1e">
    <ellipse cx="470" cy="330" rx="70" ry="78"/>
    <path d="M400 400 q70 -40 140 0 l30 260 q-100 40 -200 0 z"/>
    <path d="M400 420 l-90 140 q-10 20 10 32 l60 -100 z"/>
    <path d="M540 420 l90 200 q10 20 -14 30 l-90 -190 z"/>
  </g>

  <!-- welding torch spark lines -->
  <g stroke="#ffd27a" stroke-width="4" stroke-linecap="round" opacity="0.9">
    <line x1="600" y1="600" x2="640" y2="560"/>
    <line x1="610" y1="620" x2="660" y2="610"/>
    <line x1="600" y1="640" x2="630" y2="680"/>
    <line x1="580" y1="650" x2="590" y2="700"/>
  </g>

  <!-- rust accent frame corner -->
  <g stroke="#c1470f" stroke-width="8">
    <line x1="0" y1="60" x2="120" y2="60"/>
    <line x1="60" y1="0" x2="60" y2="120"/>
  </g>
</svg>
